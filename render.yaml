services:
  - type: web
    name: acg-polymarket
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npx prisma migrate deploy && npm run db:bootstrap && npm run start -- -H 0.0.0.0 -p $PORT
    initialDeployHook: npm run db:bootstrap
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: MARKET_QUOTE_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: BANGUMI_USER_AGENT
        value: ACG_Polymarket/0.1 (+https://github.com/Nickwong-kyoaka/ACG_Polymarket)
      - key: ADS_PROVIDER
        value: mock
      - key: GOOGLE_AD_CLIENT
        value: ""
      - key: S3_BUCKET
        value: acg-polymarket-assets
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        value: ""
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        value: ""
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_ADMIN_ENABLED
        value: "false"
      - key: ALLOW_BETA_RESET
        value: "false"
