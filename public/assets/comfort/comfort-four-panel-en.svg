<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">A quiet four-panel comfort story</title><desc id="desc">An original ACG-style comic about entering a comfort room, lowering outside noise, receiving a kind message, and resting until tomorrow.</desc><defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#18243d"/><stop offset="1" stop-color="#6b5bb5"/></linearGradient><linearGradient id="b" x2="1" y2="1"><stop stop-color="#ff6c85"/><stop offset="1" stop-color="#ffbe68"/></linearGradient></defs><rect width="1600" height="900" fill="#f7f1e5"/><g stroke="#111827" stroke-width="12"><rect x="35" y="35" width="745" height="385" rx="30" fill="url(#a)"/><rect x="820" y="35" width="745" height="385" rx="30" fill="#dff5f1"/><rect x="35" y="460" width="745" height="405" rx="30" fill="#fff"/><rect x="820" y="460" width="745" height="405" rx="30" fill="url(#b)"/></g><g font-family="sans-serif" font-weight="900"><text x="78" y="100" fill="#ffcc66" font-size="34">01 · COME IN</text><text x="78" y="348" fill="#fff" font-size="34">The comfort-room sign turns on.</text><text x="863" y="100" fill="#19757a" font-size="34">02 · QUIET</text><path d="M1010 245h360" stroke="#19757a" stroke-width="20" stroke-linecap="round"/><path d="M1090 175l-80 70 80 70M1290 175l80 70-80 70" fill="none" stroke="#19757a" stroke-width="20"/><text x="863" y="348" fill="#263044" font-size="34">Outside noise becomes smaller.</text><text x="78" y="525" fill="#e83c62" font-size="34">03 · FOR YOU</text><rect x="155" y="585" width="510" height="162" rx="28" fill="#fff1f3" stroke="#ff6c85" stroke-width="8"/><text x="410" y="655" text-anchor="middle" fill="#111827" font-size="34">You did enough</text><text x="410" y="704" text-anchor="middle" fill="#111827" font-size="34">for today.</text><text x="863" y="525" fill="#fff" font-size="34">04 · TOMORROW</text><circle cx="1335" cy="640" r="92" fill="#fff4b5"/><path d="M905 806c140-130 305-99 620-42" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="22"/><text x="863" y="835" fill="#fff" font-size="34">Tomorrow is allowed to wait.</text></g></svg>
