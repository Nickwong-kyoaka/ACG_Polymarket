services:
  app:
    build:
      context: .
      target: dev
    container_name: acg-polymarket-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/acg_polymarket?schema=public
      AUTH_SECRET: local-docker-auth-secret-change-before-public
      NEXTAUTH_SECRET: local-docker-auth-secret-change-before-public
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_EMAILS: wongnick.kyoaka@gmail.com
      AUTH_GOOGLE_ID: ""
      AUTH_GOOGLE_SECRET: ""
      EMAIL_SERVER_HOST: ""
      EMAIL_SERVER_PORT: "587"
      EMAIL_SERVER_USER: ""
      EMAIL_SERVER_PASSWORD: ""
      EMAIL_FROM: noreply@example.com
      BANGUMI_USER_AGENT: ACG_Polymarket/0.1 (+https://github.com/Nickwong-kyoaka/ACG_Polymarket)
      ADS_PROVIDER: mock
      GOOGLE_AD_CLIENT: ""
      S3_BUCKET: acg-polymarket-assets
      S3_REGION: auto
      S3_ENDPOINT: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_PUBLIC_BASE_URL: ""
      DEMO_MODE: "true"
      DEMO_ADMIN_ENABLED: "true"
      DEMO_USER_ID: viewer-001
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: >
      sh -c "npm run prisma:generate &&
             npm run db:push &&
             npm run db:seed &&
             npm run dev -- -H 0.0.0.0"

  postgres:
    image: postgres:16-alpine
    container_name: acg-polymarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acg_polymarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acg_polymarket"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  node_modules:
  next_cache:
  postgres_data:
